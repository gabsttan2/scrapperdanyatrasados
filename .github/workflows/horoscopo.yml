name: Atualizar Horoscopo

on:
  workflow_dispatch:

  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write

jobs:
  atualizar-horoscopo:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar scraper do horoscopo
        run: |
          python horoscopo.py

      - name: Salvar horoscopo atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add resultado/horoscopo.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao encontrada."
          else
            git commit -m "Atualiza horoscopo diario"
            git push
          fi
